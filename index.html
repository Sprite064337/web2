<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งซื้อสินค้า - Papaporn Farm</title>
    <!-- SweetAlert2 สำหรับป๊อปอัพสวยๆ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: #fff; width: 100%; max-width: 400px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #0d32a8, #f05a28); color: white; padding: 20px; text-align: center; font-size: 20px; font-weight: bold; }
        .form-group { padding: 15px 20px 0 20px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; color: #333; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
        select:focus, input:focus { border-color: #0d32a8; }
        .btn-submit { background-color: #06c755; color: white; border: none; width: calc(100% - 40px); margin: 20px; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background-color: #05b34c; }
        .footer { text-align: center; font-size: 11px; color: #888; padding-bottom: 15px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        🛒 กรอกข้อมูลเพื่อสั่งซื้อสินค้า
    </div>
    
    <form id="orderForm">
        <!-- 1. เลือกจำนวนไข่ -->
        <div class="form-group">
            <label>🥚 ไข่เป็ด (เลือกจำนวนแผง) *</label>
            <select id="eggQty" required>
                <option value="">-- เลือกจำนวนแผง --</option>
                <option value="1 แผง (90 บาท)">1 แผง (90 บาท)</option>
                <option value="2 แผง (180 บาท)">2 แผง (180 บาท)</option>
                <option value="3 แผง (270 บาท)">3 แผง (270 บาท)</option>
                <option value="4 แผง (360 บาท)">4 แผง (360 บาท)</option>
                <option value="5 แผง (450 บาท)">5 แผง (450 บาท)</option>
            </select>
        </div>

        <!-- 2. ชื่อ-นามสกุล -->
        <div class="form-group">
            <label>ชื่อ-นามสกุล ผู้รับ *</label>
            <input type="text" id="name" placeholder="ชื่อ และ นามสกุล" required>
        </div>

        <!-- 3. เบอร์โทรศัพท์ -->
        <div class="form-group">
            <label>เบอร์โทรศัพท์ *</label>
            <input type="tel" id="phone" placeholder="ตัวอย่าง 0812345678" required>
        </div>

        <!-- 4. จุดรับสินค้า (แก้ไขชื่อสถานที่เรียบร้อยแล้ว) -->
        <div class="form-group">
            <label>📍 เลือกจุดรับสินค้า *</label>
            <select id="location" required>
                <option value="หน้าร้าน">หน้าร้าน</option>
                <option value="ตลาดบางระจัน">ตลาดบางระจัน</option>
                <option value="สี่แยกบ้านจ่า">สี่แยกบ้านจ่า</option>
                <option value="สามแยกหนองลี">สามแยกหนองลี</option>
            </select>
        </div>

        <!-- 5. วิธีชำระเงิน -->
        <div class="form-group">
            <label>💳 วิธีการชำระเงิน *</label>
            <select id="payment" required onchange="toggleQRCode()">
                <option value="เงินสด">เงินสด</option>
                <option value="โอนเงินผ่านธนาคาร">โอนเงินผ่านธนาคาร</option>
            </select>
        </div>

        <!-- 📸 กล่องแสดง QR Code สำหรับโอนเงิน (ซ่อนไว้เป็นค่าเริ่มต้น) -->
        <div id="qrContainer" style="display: none; text-align: center; margin: 15px 20px 0 20px; padding: 15px; background: #f8f9fa; border: 1px dashed #06c755; border-radius: 10px;">
            <p style="font-weight: bold; color: #333; margin: 0 0 8px 0; font-size: 14px;">สแกน QR Code เพื่อชำระเงิน</p>
            <!-- ⚠️ ใส่ลิงก์รูปภาพ QR Code พร้อมเพย์จริงของคุณตรง src ด้านล่างนี้ -->
            <img id="qrImage" src="download.jpg" alt="QR Code ชำระเงิน" style="max-width: 200px; width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
            <p style="font-size: 12px; color: #666; margin: 8px 0 0 0;">เมื่อโอนเงินเรียบร้อยแล้ว อย่าลืมแนบสลิปใน LINE นะคะ 🙏</p>
        </div>

        <!-- ปุ่มกดสั่งซื้อ -->
        <button type="button" class="btn-submit" onclick="submitOrder()">ส่งข้อมูลสั่งซื้อเข้าไลน์ร้าน</button>
    </form>

    <div class="footer">
        © 2026 ระบบสั่งซื้อสินค้า ปลอดภัย 100%
    </div>
</div>

<script>
// 🔄 ฟังก์ชัน ซ่อน/แสดง QR Code ตามการเลือกชำระเงิน
function toggleQRCode() {
    var paymentMethod = document.getElementById("payment").value;
    var qrContainer = document.getElementById("qrContainer");

    if (paymentMethod === "โอนเงินผ่านธนาคาร") {
        qrContainer.style.display = "block";
    } else {
        qrContainer.style.display = "none";
    }
}

// 🚀 ฟังก์ชัน คัดลอกออเดอร์ลง Clipboard และเปิด LINE
function submitOrder() {
    var eggQty = document.getElementById("eggQty").value;
    var name = document.getElementById("name").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var location = document.getElementById("location").value;
    var payment = document.getElementById("payment").value;

    if (!eggQty || !name || !phone) {
        Swal.fire({
            icon: 'warning',
            title: 'กรุณากรอกข้อมูลให้ครบถ้วน',
            text: 'โปรดเลือกจำนวนไข่ กรอกชื่อ และเบอร์โทรศัพท์ก่อนกดสั่งซื้อครับ'
        });
        return;
    }

    // 📝 รูปแบบข้อความออเดอร์ส่งเข้าไลน์
    var orderText = `[ออเดอร์ Papaporn Farm]\n` +
                    `ไข่ขนาดเล็ก: ${eggQty}\n` +
                    `ไข่ขนาดใหญ่: ไม่รับ\n` +
                    `ชื่อผู้รับ: ${name}\n` +
                    `เบอร์โทร: ${phone}\n` +
                    `ที่อยู่จัดส่ง: ${location} (${payment})`;

    // 📋 คัดลอกข้อความเข้า Clipboard อัตโนมัติ
    navigator.clipboard.writeText(orderText).then(function() {
        
        Swal.fire({
            icon: 'success',
            title: 'คัดลอกข้อความเรียบร้อยแล้ว!',
            text: 'ระบบก๊อปปี้ออเดอร์ลงคลิปบอร์ดให้แล้ว กดปุ่มด้านล่างเพื่อเปิดแชท LINE แล้ววาง (Paste) ส่งได้เลยครับ',
            confirmButtonText: 'เปิดแชท LINE ร้านค้า',
            confirmButtonColor: '#06c755'
        }).then((result) => {
            if (result.isConfirmed) {
                // ⚠️ เปลี่ยนลิงก์นี้ให้เป็นลิงก์ LINE OA / เพิ่มเพื่อน ของร้านคุณครับ
                window.location.href = "https://line.me/R/ti/p/@364jrrez?oat_content=url&ts=09170028"; 
            }
        });

    }).catch(function(err) {
        // กรณีเบราว์เซอร์ไม่อนุญาต ให้ใช้วิธีสำรองคัดลอก
        var tempInput = document.createElement("textarea");
        tempInput.value = orderText;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);

        Swal.fire({
            icon: 'success',
            title: 'คัดลอกข้อความเรียบร้อยแล้ว!',
            text: 'กดปุ่มด้านล่างเพื่อเปิดแชท LINE แล้ววาง (Paste) ส่งได้เลยครับ',
            confirmButtonText: 'เปิดแชท LINE ร้านค้า',
            confirmButtonColor: '#06c755'
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = "https://line.me/R/ti/p/@364jrrez?oat_content=url&ts=09170028"; 
            }
        });
    });
}
</script>

</body>
</html>
