<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg overflow-hidden">
    
    <!-- Header (ลบข้อความด้านบนออกแล้ว) -->
    <div class="bg-gradient-to-r from-blue-900 via-indigo-800 to-orange-500 p-6 text-center text-white">
      <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
        🛒 กรอกข้อมูลเพื่อสั่งซื้อสินค้า
      </h1>
    </div>

    <!-- Form Content -->
    <form id="orderForm" class="p-6 space-y-4">
      
      <!-- 1. เลือกจำนวนไข่ (เหลือขนาดเดียว) -->
      <div>
        <label class="block text-gray-700 font-semibold mb-1">🥚 ไข่ไก่ (เลือกจำนวนแผง) *</label>
        <select required class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-green-500 focus:outline-none">
          <option value="">-- เลือกจำนวนแผง --</option>
          <option value="1">1 แผง</option>
          <option value="2">2 แผง</option>
          <option value="3">3 แผง</option>
          <option value="5">5 แผง</option>
          <option value="10">10 แผง</option>
        </select>
      </div>

      <!-- 2. ชื่อ-นามสกุล -->
      <div>
        <label class="block text-gray-700 font-semibold mb-1">ชื่อ-นามสกุล ผู้รับ *</label>
        <input type="text" required placeholder="ชื่อ และ นามสกุล" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-green-500 focus:outline-none">
      </div>

      <!-- 3. เบอร์โทรศัพท์ -->
      <div>
        <label class="block text-gray-700 font-semibold mb-1">เบอร์โทรศัพท์ *</label>
        <input type="tel" required placeholder="ตัวอย่าง 0812345678" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-green-500 focus:outline-none">
      </div>

      <!-- 4. เลือกจุดรับสินค้า -->
      <div>
        <label class="block text-gray-700 font-semibold mb-1">📍 เลือกจุดรับสินค้า *</label>
        <select required class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-green-500 focus:outline-none">
          <option value="หน้าร้าน">หน้าร้าน</option>
          <option value="จัดส่งถึงบ้าน">จัดส่งถึงบ้าน</option>
        </select>
      </div>

      <!-- 5. เลือกวิธีการชำระเงิน -->
      <div>
        <label class="block text-gray-700 font-semibold mb-1">💳 วิธีการชำระเงิน *</label>
        <select id="paymentMethod" required class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-green-500 focus:outline-none" onchange="toggleQRCode()">
          <option value="cash">เงินสด</option>
          <option value="transfer">เงินโอน (สแกน QR Code)</option>
        </select>
      </div>

      <!-- แสดง QR Code พร้อมรายละเอียดบัญชี -->
      <div id="qrCodeContainer" class="hidden text-center p-4 border border-dashed border-gray-300 rounded-lg bg-gray-50 space-y-2">
        <p class="text-sm font-semibold text-gray-700">สแกน QR Code เพื่อชำระเงิน</p>
        
        <!-- แท็กรูปภาพ QR Code (ถ้าบันทึกไฟล์รูปไว้ในเครื่อง ให้เปลี่ยน src="qr-promptpay.jpg" หรือเปลี่ยนเป็น URL รูปของคุณ) -->
        <img id="qrImage" src="qr-promptpay.jpg" alt="Thai QR Payment" class="mx-auto max-w-[220px] rounded-lg shadow-sm border">
        
        <div class="text-xs text-gray-600 mt-2 space-y-0.5">
          <p class="font-bold text-gray-800">ชื่อบัญชี: นาย ศุภณัฐ ยิ้มพราย</p>
          <p>ธนาคารกสิกรไทย: xxx-x-x3240-x</p>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl transition duration-200 text-lg shadow-md mt-4">
        ส่งข้อมูลสั่งซื้อเข้าไลน์ร้าน
      </button>

    </form>

    <!-- Footer -->
    <div class="text-center p-3 text-xs text-gray-400 border-t">
      © 2026 ระบบสั่งซื้อสินค้า ปลอดภัย 100%
    </div>

  </div>

  <script>
    function toggleQRCode() {
      const paymentMethod = document.getElementById('paymentMethod').value;
      const qrCodeContainer = document.getElementById('qrCodeContainer');

      if (paymentMethod === 'transfer') {
        qrCodeContainer.classList.remove('hidden');
      } else {
        qrCodeContainer.classList.add('hidden');
      }
    }
  </script>

</body>
</html>
